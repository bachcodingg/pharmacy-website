# fly.toml app configuration file generated for pharmacy-search-giabach on 2026-08-09T16:49:56+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pharmacy-search-giabach'
primary_region = 'sin'

[build]

[env]
  PHARMACY_SEARCH_DB = '/data/app.db'

[mounts]
  source = 'pharmacy_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
